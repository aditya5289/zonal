# nginx site for the Smart Clean Campus API.
#
#   sudo cp deploy/nginx-zonal.conf /etc/nginx/sites-available/zonal
#   sudo ln -s /etc/nginx/sites-available/zonal /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Run certbot AFTER the HTTP block is live - it needs port 80 to prove the
# domain, then rewrites this file with the certificate paths.
#
#   sudo certbot --nginx -d clean.mmmut.ac.in

# Rate limit at the edge as well as in the app. nginx sheds a flood before it
# ever reaches Node; the app's own limiter is the backstop.
limit_req_zone $binary_remote_addr zone=zonal_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=zonal_auth:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name clean.mmmut.ac.in;

    # Certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name clean.mmmut.ac.in;

    # certbot fills these in.
    ssl_certificate     /etc/letsencrypt/live/clean.mmmut.ac.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clean.mmmut.ac.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Tell browsers never to try HTTP again. Only enable once HTTPS is
    # confirmed working - it is hard to undo, browsers cache it for a year.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Complaint media can be tens of megabytes; the default 1 MB would reject
    # every video upload with an unhelpful 413.
    client_max_body_size 30M;

    access_log /var/log/nginx/zonal-access.log;
    error_log  /var/log/nginx/zonal-error.log;

    location /api/auth/ {
        limit_req zone=zonal_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=zonal_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads can be slow on a phone connection.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
