# javax.net.ssl.trustStoreType=WINDOWS-ROOT makes Gradle validate TLS against
# the Windows certificate store instead of the JDK's own bundled cacerts.
#
# Needed because antivirus software with HTTPS scanning (Avast, Kaspersky,
# ESET and friends) intercepts TLS and re-signs every certificate with its own
# root CA. Windows trusts that root; the JVM's private truststore does not, so
# dependency downloads fail with:
#   PKIX path building failed: unable to find valid certification path
#
# This uses the OS trust store rather than disabling verification, so
# certificates are still properly checked.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djavax.net.ssl.trustStoreType=WINDOWS-ROOT
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
