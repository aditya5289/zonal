# Postgres for local development.
#
# Deliberately on host port 5433, not 5432: a local PostgreSQL service is
# already running on 5432 on this machine, and binding both to the same port
# produces a confusing "connection refused" rather than a clear error.
#
#   docker compose up -d        start
#   docker compose logs -f db   watch it
#   docker compose down         stop (data survives)
#   docker compose down -v      stop and wipe the data

services:
  db:
    image: postgres:18-alpine
    container_name: zonal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zonal
      POSTGRES_PASSWORD: zonal_dev_password
      POSTGRES_DB: zonal
      # Faster startup; this database holds nothing precious.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18+ expects a single mount at /var/lib/postgresql and places
      # the data in a major-version subdirectory itself. Mounting the old
      # /var/lib/postgresql/data path makes the container refuse to start.
      - zonal_pgdata:/var/lib/postgresql
    healthcheck:
      # Prisma migrate fails confusingly if it connects before Postgres is
      # ready, so anything depending on this should wait for the healthcheck.
      test: ["CMD-SHELL", "pg_isready -U zonal -d zonal"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  zonal_pgdata:
